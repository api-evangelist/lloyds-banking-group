standard: OBIE Read/Write API Standard (UK Open Banking) 4.0.1
authentication:
  style: OAuth2 / OpenID Connect (FAPI 1.0 Advanced)
  transport_security: Mutual TLS (mTLS) client authentication with OBIE/eIDAS certificates
  strong_customer_authentication: PSD2 SCA via the PSUOAuth2Security authorization-code flow
  client_credentials: TPPOAuth2Security client-credentials flow for TPP-to-ASPSP access
  message_signing:
    header: x-jws-signature
