      Detached JWS signature over the request/response body for non-repudiation on
      payment and file resources (JWS with b64=false per OBIE standard).
  ref: authentication/lloyds-banking-group-authentication.yml
idempotency:
  supported: true
  header: x-idempotency-key
  scope: >-
    Required on payment-initiation and funds-confirmation write operations
    (CreateDomesticPayments, CreateInternationalPayments, CreateFilePayments,
    domesticVrpPost, CreateFundsConfirmations, and their consent-creation
    operations). The same x-idempotency-key replayed within the retention window
    returns the original resource rather than creating a duplicate payment.
  max_length: 40
  retention: 24 hours (per OBIE Read/Write standard guidance)
  evidence: >-
    x-idempotency-key header parameter appears on 18 payment operations, 7 VRP
    operations, and 3 CBPII/AIS write operations across the harvested specs.
pagination:
  style: cursor/link-based (HATEOAS Links object)
  response_links: [Self, First, Prev, Next, Last]
  meta_fields: [TotalPages, FirstAvailableDateTime, LastAvailableDateTime]
  request_params:
    - name: page
      in: query
      note: Present on transaction and statement collection endpoints.
  detail: >-
    Collections return a Links object with First/Prev/Next/Last hrefs and a Meta
    object carrying TotalPages; clients follow Links.Next rather than constructing
    offsets.
request_tracing:
  interaction_id_header: x-fapi-interaction-id
  detail: >-
    An RFC4122 UUID echoed by the ASPSP in the response for end-to-end correlation
    and support; the FAPI standard requires it be logged on both ends.
  related_headers:
    - x-fapi-auth-date
    - x-fapi-customer-ip-address
    - x-customer-user-agent
versioning:
  scheme: uri-path
  current: v4.0 (OBIE Read/Write); Open Data on v2.2/v3.x hosts
  detail: >-
    Major version in the path segment (e.g. /open-banking/v3.1, /open-banking/v4.0/aisp).
