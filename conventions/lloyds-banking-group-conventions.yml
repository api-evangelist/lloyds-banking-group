error_envelope:
  media_type: application/json
  schema: OBErrorResponse1
  shape: >-
    Top-level { Code, Id, Message, Errors[] } where each Errors[] item is an
    OBError1 { ErrorCode (UK.OBIE.* namespace), Message, Path, Url }. ErrorCode is
    the machine-readable field; Code/Message at the top level are deprecated.
  ref: errors/lloyds-banking-group-problem-types.yml
rate_limit_signaling:
  status_code: 429
  detail: >-
    All Read/Write operations declare a 429 (Too Many Requests) response. Per-TPP
    throttling is applied by the ASPSP gateway; specific published limits are not
    exposed in the standard specification.
consent_model:
  detail: >-
    Every data or payment interaction is gated by a consent resource
    (account-access-consent, payment-consent, funds-confirmation-consent, VRP
    consent) that the PSU authorises via SCA before the TPP may act. Consents carry
    an explicit status lifecycle (AwaitingAuthorisation -> Authorised -> Consumed /
    Revoked / Rejected).
