name: Lloyds Banking Group
kind: company
description: Lloyds Banking Group plc is the United Kingdom's largest retail and
  commercial banking group, serving personal, business, and corporate customers
  through the Lloyds Bank, Halifax, Bank of Scotland, MBNA, and Scottish Widows
  brands. Formed in 2009 through the acquisition of HBOS by Lloyds TSB, it is a
  publicly listed company on the London Stock Exchange (LLOY) and a FTSE 100
  constituent - not a mutual or building society. It is authorised by the
  Prudential Regulation Authority and regulated by the Financial Conduct
  Authority and the PRA. As one of the nine CMA-mandated banks (CMA9), Lloyds
  operates a public developer platform at developer.lloydsbanking.com that
  publishes UK Open Banking (OBIE / PSD2) APIs - unauthenticated Open Data
  reference APIs for ATMs, branches, and product information, plus the FAPI-secured
  Read/Write family - Account and Transaction Information (AIS), Payment
  Initiation (PIS), Confirmation of Funds (CBPII), Variable Recurring Payments
  (VRP), and Event Notifications - conformant to the Open Banking Implementation
  Entity (OBIE) Read/Write API Standard, secured with OAuth2/OIDC, mutual-TLS,
  and PSD2 strong customer authentication using OBIE/eIDAS certificates.
