- aid: lloyds-banking-group:open-data-api
  name: Lloyds Banking Group Open Data API
  description: Public, unauthenticated UK Open Banking Open Data API exposing
    reference data - ATMs, branches, personal current accounts, business current
    accounts, unsecured SME loans, and commercial credit cards - conformant to the
    OBIE Open Data standard. Confirmed live for the Lloyds Bank brand host on
    2026-07-23 (HTTP 200), with equivalent hosts for the Halifax and Bank of
    Scotland brands.
