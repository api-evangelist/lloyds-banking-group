- aid: lloyds-banking-group:variable-recurring-payments-api
  name: Lloyds Banking Group Variable Recurring Payments API
  description: OBIE Variable Recurring Payments (VRP) profile API enabling
    consent-based recurring payments under a customer-agreed mandate, including
