- aid: lloyds-banking-group:account-information-api
  name: Lloyds Banking Group Account and Transaction Information API
  description: OBIE Read/Write Account and Transaction Information (AIS) API for
    accessing account, balance, transaction, beneficiary, standing order, direct
    debit, and statement data with customer consent. FAPI-secured (OAuth2/OIDC,
    mTLS, PSD2 SCA); requires developer-portal onboarding and Open Banking directory
    registration. Spec provenance is the shared OBIE Read/Write standard, not a
    Lloyds-proprietary contract.
  humanURL: https://developer.lloydsbanking.com/prod01/lbg/products
  baseURL: https://api.lloydsbank.com/open-banking/v3.1
