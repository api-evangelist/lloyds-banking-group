- aid: lloyds-banking-group:confirmation-of-funds-api
  name: Lloyds Banking Group Confirmation of Funds API
  description: OBIE Read/Write Confirmation of Funds (CBPII) API allowing an
    authorised card-based payment instrument issuer to check whether funds are
    available on a customer account. FAPI-secured (OAuth2/OIDC, mTLS, PSD2 SCA);
    requires developer-portal onboarding and Open Banking directory registration.
    Spec provenance is the shared OBIE Read/Write standard, not a Lloyds-proprietary
